model:
  name: "distilbert/distilgpt2"
  dtype: "float32"
  split_layer: 3          # Worker 1: layers 0..2, Worker 2: layers 3..5
  max_new_tokens: 32
  decoding: "greedy"

network:
  coordinator_host: "127.0.0.1"
  coordinator_port: 50050
  worker1_host: "127.0.0.1"
  worker1_port: 50051
  worker2_host: "127.0.0.1"
  worker2_port: 50052
  token_selection_mode: "coordinator"  # "coordinator" (Mode A) or "worker" (Mode B)

scheduling:
  max_concurrent_requests: 8
  worker1_queue_size: 16
  worker2_queue_size: 16
  enable_micro_batching: false

reliability:
  rpc_deadline_ms: 5000
  max_retries: 3
  cache_ttl_seconds: 300

evaluation:
  concurrency_levels: [1, 2, 4]
  prompt_lengths: [16, 32, 64]
  generation_lengths: [16, 32]
  warmup_runs: 2
  repetitions: 5
  results_dir: "results"
